version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ai_research_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ai_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mongodb
    networks:
      - ai_research_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai_frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - ai_research_net

networks:
  ai_research_net:
    driver: bridge

volumes:
  mongodb_data:
